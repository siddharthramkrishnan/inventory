<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achira Inventory - Verify GRNs</title>
<style>
  :root{
    --ink:#16211f;
    --paper:#f6f7f5;
    --card:#ffffff;
    --accent:#1f5f52;
    --accent-dark:#153f37;
    --line:#dde3e0;
    --muted:#5c6b67;
    --green:#1e7a44;
    --green-bg:#e7f5ec;
    --red:#b3312c;
    --red-bg:#fbe9e8;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  header{
    background:var(--accent-dark);
    color:#fff;
    padding:22px 18px 20px;
  }
  header h1{ margin:0; font-size:19px; font-weight:700; }
  header p{ margin:4px 0 0; font-size:13px; color:#cfe0da; }
  .home-nav-link{
    display:inline-block;
    font-size:12px;
    font-weight:600;
    color:#fff;
    background:rgba(255,255,255,0.18);
    padding:3px 10px;
    border-radius:20px;
    text-decoration:none;
    margin-bottom:8px;
  }
  .home-nav-link:hover{ background:rgba(255,255,255,0.28); }
  .wrap{ max-width:560px; margin:0 auto; padding:16px 14px 60px; }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
  }
  .hint-box{
    background:var(--green-bg);
    color:var(--accent-dark);
    padding:12px 14px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:16px;
  }
  .row{
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:9px 0;
    border-bottom:1px solid #eef1f0;
    font-size:14px;
  }
  .row:last-child{ border-bottom:none; }
  .row .label{ color:var(--muted); flex-shrink:0; }
  .row .value{ text-align:right; font-weight:600; }
  .field{ margin-top:16px; }
  label{ display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
  input[type="text"], select{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
  }
  button.approve{
    width:100%;
    padding:14px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:16px;
  }
  button.approve:disabled{ opacity:0.6; cursor:default; }
  .msg{
    padding:12px 14px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:16px;
    display:none;
  }
  .msg.success{ background:var(--green-bg); color:var(--green); display:block; }
  .msg.error{ background:var(--red-bg); color:var(--red); display:block; }
  .status-badge{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    padding:3px 10px;
    border-radius:20px;
  }
  .status-badge.pending{ background:#fdf3e2; color:#a5690c; }
  .status-badge.verified{ background:var(--green-bg); color:var(--green); }
  #loading{ padding:40px 0; text-align:center; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<header>
  <a href="home.html" class="home-nav-link">← Home</a>
  <h1>\ud83d\udce6 Verify GRN</h1>
  <p>Achira Labs \u00b7 Confirm delivery against your PO</p>
</header>

<div class="wrap">
  <div id="msg" class="msg"></div>
  <div id="loading">Loading GRN details\u2026</div>
  <div id="content" style="display:none">
    <div class="hint-box">
      Please check the details below match what you ordered before approving. If anything looks wrong, contact the store manager directly rather than approving.
    </div>

    <div class="card" id="detailsCard"></div>

    <div class="card">
      <div class="field">
        <label>Your Name <span style="color:var(--red)">*</span></label>
        <input type="text" id="f-person" list="employeeList" placeholder="Start typing your name\u2026">
        <datalist id="employeeList"></datalist>
      </div>
      <button type="button" class="approve" id="approveBtn">Approve</button>
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzmGx2oO0dMGU_v6mQPc0LSxTNAdeViQSHWQjCJUc-F_VD9TsRiWJmaabqf2d10MOsO/exec';

const params = new URLSearchParams(window.location.search);
const tabParam = params.get('tab') || '';
const grnParam = params.get('grn') || '';

function jsonp(action, extraParams) {
  return new Promise(function(resolve) {
    const callbackName = 'cb_' + action + '_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    let qs = 'action=' + action + '&callback=' + callbackName;
    for (const k in extraParams) {
      qs += '&' + k + '=' + encodeURIComponent(extraParams[k]);
    }
    window[callbackName] = function(result) {
      delete window[callbackName];
      document.body.removeChild(script);
      resolve(result);
    };
    const script = document.createElement('script');
    script.src = APPS_SCRIPT_URL + '?' + qs;
    script.onerror = function() {
      delete window[callbackName];
      if (document.body.contains(script)) document.body.removeChild(script);
      resolve(null);
    };
    document.body.appendChild(script);
  });
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

function row(label, value) {
  return '<div class="row"><span class="label">' + label + '</span><span class="value">' + (value || '\u2014') + '</span></div>';
}

let currentItems = [];

async function loadDetails() {
  if (!tabParam || !grnParam) {
    document.getElementById('loading').textContent = 'Missing GRN reference \u2014 this link looks incomplete.';
    return;
  }

  const result = await jsonp('grnverifylookup', { tab: tabParam, grn: grnParam });
  document.getElementById('loading').style.display = 'none';

  if (!result || result.status !== 'success') {
    showMsg((result && result.message) || 'Could not load this GRN.', 'error');
    return;
  }

  // Reset to a known-good default before re-evaluating — matters on
  // refresh after a partial approval, where some items may still need
  // approving.
  document.getElementById('approveBtn').disabled = false;
  document.getElementById('approveBtn').textContent = 'Approve';

  // FIX: one GRN No. can cover MULTIPLE items in a single delivery (e.g.
  // one invoice with 3 line items) \u2014 this now shows every item under
  // this GRN No. together, and approving confirms the whole delivery at
  // once rather than one item at a time.
  currentItems = result.items || [];
  const first = currentItems[0] || {};
  const allVerified = currentItems.length > 0 && currentItems.every(function(g) { return g.verificationStatus === 'Verified'; });

  const badge = allVerified
    ? '<span class="status-badge verified">Verified</span>'
    : '<span class="status-badge pending">Pending Verification</span>';

  const itemsHtml = currentItems.length === 0
    ? '<div style="color:var(--muted);font-size:13px;padding:10px 0">No GRNs pending verification.</div>'
    : currentItems.map(function(g, idx) {
        const cbId = 'verify-item-cb-' + idx;
        const isVerified = g.verificationStatus === 'Verified';
        const checkboxHtml = isVerified
          ? '<span class="status-badge verified" style="margin-right:8px">Verified</span>'
          : '<input type="checkbox" class="verify-item-checkbox" id="' + cbId + '" data-desc="' + String(g.materialDescription || '').replace(/"/g, '&quot;') + '" checked style="margin-right:8px">';
        return '<div style="display:flex;align-items:flex-start;gap:8px;margin:14px 0 4px">' +
            checkboxHtml +
            (currentItems.length > 1 ? '<label for="' + cbId + '" style="font-weight:700;color:var(--accent-dark)">Item ' + (idx + 1) + '</label>' : '<span></span>') +
          '</div>' +
          row('Material', g.materialDescription) +
          row('Quantity', g.quantity) +
          row('Invoice Amount', g.invoiceAmount);
      }).join('');

  document.getElementById('detailsCard').innerHTML =
    '<div style="margin-bottom:10px">' + badge +
      (currentItems.length > 1 ? ' <span style="color:var(--muted);font-size:12px;margin-left:6px">' + currentItems.length + ' items in this delivery</span>' : '') +
    '</div>' +
    row('GRN No.', first.grnNo) +
    row('PO No.', first.poNo) +
    row('Vendor', first.partyName) +
    row('Invoice No.', first.invoiceNo) +
    row('Received Date', first.receivedDate) +
    row('Requested By', first.requestedBy) +
    itemsHtml;

  document.getElementById('content').style.display = 'block';

  if (allVerified) {
    showMsg('\u2705 This GRN was already verified by ' + (first.verifiedBy || 'someone') + '.', 'success');
    document.getElementById('approveBtn').disabled = true;
    document.getElementById('approveBtn').textContent = 'Already Approved';
  }
}

async function loadEmployees() {
  const result = await jsonp('employees', {});
  if (result && result.status === 'success' && Array.isArray(result.employees)) {
    const datalist = document.getElementById('employeeList');
    result.employees.forEach(function(name) {
      const opt = document.createElement('option');
      opt.value = name;
      datalist.appendChild(opt);
    });
  }
}

document.getElementById('approveBtn').addEventListener('click', async function() {
  const person = document.getElementById('f-person').value.trim();
  if (!person) {
    showMsg('Please enter your name before approving.', 'error');
    return;
  }

  // Only the checked items get approved — anything unchecked stays
  // Pending Verification, so the requester can hold back an item they're
  // unsure about while still confirming the rest of the delivery.
  const checkedBoxes = Array.from(document.querySelectorAll('.verify-item-checkbox:checked'));
  if (currentItems.length > 0 && document.querySelectorAll('.verify-item-checkbox').length > 0 && checkedBoxes.length === 0) {
    showMsg('Please check at least one item to approve.', 'error');
    return;
  }
  const selectedDescriptions = checkedBoxes.map(function(cb) { return cb.getAttribute('data-desc'); });

  const btn = this;
  btn.disabled = true;
  btn.textContent = 'Approving\u2026';

  const result = await jsonp('grnverify', {
    tab: tabParam,
    grn: grnParam,
    person: person,
    selected: JSON.stringify(selectedDescriptions),
  });

  // FIX: previously, if the response to this call got lost or garbled on
  // the way back (slow network, Apps Script response hiccup), the page
  // showed a scary "something went wrong" error even in cases where the
  // approval had ACTUALLY succeeded on the backend — genuinely confusing,
  // since the Sheet would show it correctly verified while the page
  // insisted it failed. Now ALWAYS re-fetches the real, current status
  // from the Sheet afterward (loadDetails already does this reliably,
  // using the same fast targeted lookup) and lets THAT be the source of
  // truth for what message to show — not just the original response.
  let successMsg = null;
  if (result && result.status === 'success') {
    if (result.itemsApproved > 1) {
      successMsg = result.itemsApproved + ' item(s) approved.';
    } else if (result.itemsApproved === 1) {
      successMsg = 'Item approved.';
    } else {
      successMsg = 'GRN ' + grnParam + ' approved.';
    }
    if (result.itemsSkipped) {
      successMsg += ' ' + result.itemsSkipped + ' item(s) left as Pending Verification (not checked).';
    }
  }

  await loadDetails(); // re-fetch ground truth from the Sheet no matter what the response above said

  const nowAllApproved = selectedDescriptions.every(function(desc) {
    const match = currentItems.find(function(item) {
      return String(item.materialDescription || '').trim() === desc;
    });
    return match && match.verificationStatus === 'Verified';
  });

  if (successMsg) {
    showMsg('\u2705 ' + successMsg + ' Thank you!', 'success');
  } else if (nowAllApproved) {
    // The original response looked like a failure, but the Sheet now
    // shows everything checked IS actually verified — it really did
    // work, the response just didn't come through cleanly. Trust the
    // Sheet, not the network hiccup.
    showMsg('\u2705 Confirmed in the sheet \u2014 your approval went through, even though this page had trouble showing it a moment ago.', 'success');
  } else {
    showMsg((result && result.message) || 'Something went wrong \u2014 please check the sheet directly, or try again.', 'error');
    btn.disabled = false;
    btn.textContent = 'Approve';
  }
});

loadDetails();
loadEmployees();
</script>
</body>
</html>
